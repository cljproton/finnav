name: Build & Push Frontend Image

# 拆分自原 build-images.yml：本 workflow 只构建前端镜像。
# 服务器不本地构建：构建 amd64 镜像推送到 GHCR，服务器只需 docker compose pull
# （见 docker/README.md「服务器零构建部署」）。
on:
  workflow_dispatch:
    inputs:
      seo_origin:
        description: 'SPA 壳 canonical 根域名（含 https://，如 https://fn.9418666.xyz）'
        required: false
        default: 'https://fn.9418666.xyz'
      seo_title:
        description: 'SPA 壳兜底 <title>'
        required: false
        default: '金融与 Web3 站点导航 | FinNav'
      seo_description:
        description: 'SPA 壳兜底 meta description'
        required: false
        default: 'FinNav：一个金融与 Web3 站点导航，收录官网入口、APP 下载、新手教程与用户评价。'

concurrency:
  group: build-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ${{ github.repository }}-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_tag=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |-
            SEO_ORIGIN=${{ inputs.seo_origin }}
            SEO_TITLE=${{ inputs.seo_title }}
            SEO_DESCRIPTION=${{ inputs.seo_description }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max