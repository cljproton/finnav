services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    image: "${BACKEND_IMAGE:-finnav-backend}"
    pull_policy: missing
    restart: unless-stopped
    environment:
      # 生产环境建议关闭 DEBUG
      DEBUG: "${DEBUG:-False}"
      SECRET_KEY: "${SECRET_KEY:-please-change-this-secret-key}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-*}"
      # CSRF 可信来源（逗号分隔，含 scheme，如 https://fn.example.com）
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
      # Email（可选）：设置 RESEND_API_KEY 才启用邮件，否则验证码打印到后端日志
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-onboarding@resend.dev}"
      # 数据目录（SQLite + media），挂载自 docker/data
      DB_ENGINE: "${DB_ENGINE:-sqlite}"
      DB_NAME: "${DB_NAME:-/srv/data/db.sqlite3}"
      DB_USER: "${DB_USER:-}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      DB_HOST: "${DB_HOST:-}"
      DB_PORT: "${DB_PORT:-}"
      DB_CHARSET: "${DB_CHARSET:-utf8mb4}"
      DB_CONN_MAX_AGE: "${DB_CONN_MAX_AGE:-60}"
      MEDIA_ROOT: "/srv/data/media"
      # 静态 SEO 页面输出目录：写入共享数据卷 docker/data/web-seo，
      # 前端 nginx 只读挂载到 /seo-generated 供爬虫抓取。
      WEB_SEO_OUTPUT_DIR: "/srv/data/web-seo"
    volumes:
      - ./data:/srv/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      # SPA 壳兜底 SEO；服务器零构建部署不受影响，仅本地 --build 时生效
      args:
        SEO_ORIGIN: "${SEO_ORIGIN:-https://fn.9418666.xyz}"
        SEO_TITLE: "${SEO_TITLE:-金融与 Web3 站点导航 | FinNav}"
        SEO_DESCRIPTION: "${SEO_DESCRIPTION:-FinNav：一个金融与 Web3 站点导航，收录官网入口、APP 下载、新手教程与用户评价。}"
    image: "${FRONTEND_IMAGE:-finnav-frontend}"
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      - backend
    # 一体化部署：前端 nginx 反代到内网 backend（${BACKEND_URL} 经 envsubst 注入）
    environment:
      BACKEND_URL: "http://backend:8000"
    volumes:
      # 后端 render_seo_pages 生成的静态 SEO 页面，只读挂载给 nginx 兜底抓取
      - ./data/web-seo:/usr/share/nginx/html/seo-generated:ro
    ports:
      - "127.0.0.1:${PORT:-80}:80"
